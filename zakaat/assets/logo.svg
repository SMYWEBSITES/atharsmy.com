<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Zakat">
  <defs>
    <linearGradient id="sky" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e6a8"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7b0a"/>
    </linearGradient>
    <radialGradient id="dome" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#065f46" stop-opacity="0.15"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Arch frame (mihrab shape) -->
  <path d="M48 6 C72 6 88 22 88 44 L88 88 C88 90 86 92 84 92 L12 92 C10 92 8 90 8 88 L8 44 C8 22 24 6 48 6Z" fill="url(#sky)" stroke="url(#gold)" stroke-width="1.8"/>
  <path d="M48 12 C68 12 80 24 80 42 L80 84 L16 84 L16 42 C16 24 28 12 48 12Z" fill="none" stroke="#d4af37" stroke-width="0.6" opacity="0.35"/>
  <!-- 8-point star mosaic -->
  <g opacity="0.25" stroke="#d4af37" stroke-width="0.5" fill="none">
    <path d="M48 18 L51 27 L60 30 L51 33 L48 42 L45 33 L36 30 L45 27 Z"/>
    <circle cx="48" cy="30" r="8"/>
  </g>
  <!-- Mosque silhouette -->
  <g filter="url(#glow)">
    <ellipse cx="48" cy="52" rx="22" ry="13" fill="url(#dome)"/>
    <path d="M26 52 Q48 36 70 52" fill="#047857" opacity="0.35"/>
    <rect x="22" y="48" width="7" height="28" rx="1" fill="#065f46" opacity="0.7"/>
    <rect x="67" y="48" width="7" height="28" rx="1" fill="#065f46" opacity="0.7"/>
    <polygon points="25.5,48 29,38 32.5,48" fill="#0d9488" opacity="0.6"/>
    <polygon points="70.5,48 74,38 77.5,48" fill="#0d9488" opacity="0.6"/>
    <path d="M18 76 Q48 58 78 76 L78 84 L18 84 Z" fill="#064e3b" opacity="0.85"/>
  </g>
  <!-- Crescent & star (hilal) -->
  <path d="M48 32 C40 24 28 27 28 38 C28 48 40 54 48 46 C56 54 68 48 68 38 C68 27 56 24 48 32Z" fill="url(#gold)"/>
  <circle cx="58" cy="34" r="4" fill="#fffef5"/>
  <polygon points="48,22 49.5,26.2 54,26.2 50.2,29 51.5,33.5 48,30.5 44.5,33.5 45.8,29 42,26.2 46.5,26.2" fill="#fffef5"/>
</svg>
